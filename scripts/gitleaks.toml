title = "Exawatt public-source secret scanning"

# Extend gitleaks' maintained defaults rather than replacing them: a replacement
# silently drops every rule added upstream after this file was written.
#
# Do not broad-allow fixture paths here. Secret-shaped fixtures in this
# repository are assembled at runtime from parts instead, so a real secret
# committed beside one still fails the gate.
[extend]
useDefault = true

# The allowlist below is scoped to EXACT SECRET VALUES, never to paths, files,
# or commits. Three properties follow from that and none of them survives a
# path allowlist:
#
#   1. a real credential committed beside an allowed literal still fails;
#   2. an entry is falsifiable — anyone can decode the value and check the
#      claim written next to it;
#   3. it survives projection. The public repository receives a REWRITTEN
#      history (`scripts/lib/public-projection.mjs`), so every commit SHA
#      differs from the private one and a `.gitleaksignore` fingerprint
#      (`commit:file:rule:line`) would silently match nothing there. A value
#      is the same value in both histories.
#
# Every entry is a literal that a PUBLIC-classified path carried at some
# revision. The public job scans COMPLETE public history, so removing the
# literal from the current tree does not clear the finding; only history
# rewriting would, and this repository does not rewrite history.
[[allowlists]]
description = """
RFC 9562 §A.1's example UUID, used as the `idempotencyKey` fixture in the
product-feedback contract tests and the versioned request fixture. It is a
documentation constant, not an issued key; gitleaks reports it only because
the identifier next to it ends in `Key`. Later revisions use an obviously
synthetic 1-2-4-8-5 pattern instead, but the example UUID stays in the
history those revisions replaced.
"""
regexTarget = "secret"
regexes = ['''^123e4567-e89b-42d3-a456-426614174000$''']

[[allowlists]]
description = """
A three-segment fixture JWT whose payload decodes to {"alg":"HS256"},
{"sub":"user"} and the literal ASCII word `signature` — it carries no claim,
no issuer and no key material, and it exists so a redaction test has
something JWT-shaped to redact. `electron/main/diagnostics-report.test.ts`
now assembles it from parts at runtime for exactly this reason; the literal
remains in the revision that predates that change.
"""
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ1c2VyIn0\.c2lnbmF0dXJl$''',
]
