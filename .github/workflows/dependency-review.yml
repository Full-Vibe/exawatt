name: Dependency Review

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  review:
    # Evaluates only the pull-request delta, so a known baseline finding cannot
    # hide a newly introduced high-severity dependency. The dependency graph it
    # reads is free on public repositories and paid on private ones, so the job
    # skips itself until ENG-030 flips visibility.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reject newly introduced high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
